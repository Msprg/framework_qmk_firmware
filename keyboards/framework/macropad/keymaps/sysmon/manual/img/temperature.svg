ll:#f00304}66.67%{fill:#f00304}66.93%{fill:#2a2d33}68.8%{fill:#2a2d33}69.07%{fill:#fd0000}69.33%{fill:#ff0000}73.07%{fill:#ff0000}73.33%{fill:#2a2d33}77.33%{fill:#2a2d33}77.6%{fill:#ff0000}81.6%{fill:#ff0000}81.87%{fill:#2a2d33}85.87%{fill:#2a2d33}86.13%{fill:#ff0000}90.13%{fill:#ff0000}90.4%{fill:#2a2d33}93.33%{fill:#2a2d33}93.6%{fill:#f70202}94.4%{fill:#b41012}94.67%{fill:#90181b}94.93%{fill:#51252a}95.2%{fill:#2a2d33}99.73%{fill:#2a2d33}100%{fill:#2a2d33}}@keyframes a5{0%{fill-opacity:1}16.67%{fill-opacity:0}}@keyframes a6{0%{fill-opacity:0}16.67%{fill-opacity:1}33.33%{fill-opacity:0}}@keyframes a7{0%{fill-opacity:0}33.33%{fill-opacity:1}50%{fill-opacity:0}}@keyframes a8{0%{fill-opacity:0}50%{fill-opacity:1}66.67%{fill-opacity:0}}@keyframes a9{0%{fill-opacity:0}66.67%{fill-opacity:1}91.67%{fill-opacity:0}}@keyframes a10{0%{fill-opacity:0}91.67%{fill-opacity:1}}</style><rect class="a" style="animation-name:a1" x="24" y="24" width="50" height="50" rx="7" fill="#00ff00"/><rect class="a" style="animation-name:a2" x="84" y="24" width="50" height="50" rx="7" fill="#d2ff00"/><rect class="a" style="animation-name:a3" x="144" y="24" width="50" height="50" rx="7" fill="#fed500"/><rect class="a" style="animation-name:a4" x="204" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><g class="s" style="animation-name:a5" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">45 °C</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">a quarter of the bar, green</text></g><g class="s" style="animation-name:a6" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">60 °C</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">half the bar</text></g><g class="s" style="animation-name:a7" fill-opacity="1"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">75 °C</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">into yellow and orange</text></g><g class="s" style="animation-name:a8" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">88 °C</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">nearly full</text></g><g class="s" style="animation-name:a9" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">93 °C</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">above 90 °C: the whole bar blinks</text></g><g class="s" style="animation-name:a10" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">65 °C</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">cooling down</text></g><text x="24" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">The colours are fixed per key, green on the left to red on the right; the length says how hot.</text></svg>
