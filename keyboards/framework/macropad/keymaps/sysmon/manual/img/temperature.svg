<svg xmlns="http://www.w3.org/2000/svg" width="570" height="256" viewBox="0 0 570 256" role="img" aria-label="The temperature row"><title>The temperature row</title><rect width="570" height="256" rx="12" fill="#16181c"/><rect x="300" y="24" width="50" height="50" rx="7" fill="#02ff00"/><rect x="360" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="420" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="480" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><text x="20" y="46.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">45 °C</text><text x="20" y="63.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">a quarter of the bar, green</text><rect x="300" y="92" width="50" height="50" rx="7" fill="#02ff00"/><rect x="360" y="92" width="50" height="50" rx="7" fill="#abff00"/><rect x="420" y="92" width="50" height="50" rx="7" fill="#bb8210"/><rect x="480" y="92" width="50" height="50" rx="7" fill="#2a2d33"/><text x="20" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">70 °C</text><text x="20" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">into yellow and orange</text><rect x="300" y="160" width="50" height="50" rx="7" fill="#02ff00"/><rect x="297" y="157" width="56" height="56" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="360" y="160" width="50" height="50" rx="7" fill="#abff00"/><rect x="357" y="157" width="56" height="56" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="420" y="160" width="50" height="50" rx="7" fill="#ffa900"/><rect x="417" y="157" width="56" height="56" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="480" y="160" width="50" height="50" rx="7" fill="#ff0000"/><rect x="477" y="157" width="56" height="56" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><text x="20" y="182.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Above 90 °C</text><text x="20" y="199.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the full bar, blinking</text><text x="20" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">The colours are fixed per key, green on the left to red on the right; the length says how hot.</text></svg>
