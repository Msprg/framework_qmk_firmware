<svg xmlns="http://www.w3.org/2000/svg" width="560" height="378" viewBox="0 0 560 378" role="img" aria-label="The macropad's six rows"><title>The macropad's six rows</title><rect width="560" height="378" rx="12" fill="#16181c"/><rect x="24" y="24" width="50" height="30" rx="7" fill="#1b7d20"/><rect x="84" y="24" width="50" height="30" rx="7" fill="#1b7d20"/><rect x="144" y="24" width="50" height="30" rx="7" fill="#1b7d20"/><rect x="204" y="24" width="50" height="30" rx="7" fill="#1b7d20"/><text x="278" y="37.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Battery</text><text x="278" y="54.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">charge, charging / draining</text><rect x="24" y="64" width="50" height="50" rx="7" fill="#ff0000"/><rect x="84" y="64" width="50" height="50" rx="7" fill="#aa1214"/><rect x="144" y="64" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="204" y="64" width="50" height="50" rx="7" fill="#2a2d33"/><text x="278" y="87.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">CPU</text><text x="278" y="104.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">usage; breathes when held back</text><rect x="24" y="124" width="50" height="50" rx="7" fill="#ffd700"/><rect x="84" y="124" width="50" height="50" rx="7" fill="#ffd700"/><rect x="144" y="124" width="50" height="50" rx="7" fill="#7f711f"/><rect x="204" y="124" width="50" height="50" rx="7" fill="#2a2d33"/><text x="278" y="147.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Memory</text><text x="278" y="164.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">usage; blinks at 90 %+</text><rect x="24" y="184" width="50" height="50" rx="7" fill="#ff0000"/><rect x="84" y="184" width="50" height="50" rx="7" fill="#178c8f"/><rect x="144" y="184" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="204" y="184" width="50" height="50" rx="7" fill="#2a2d33"/><text x="278" y="207.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">iGPU</text><text x="278" y="224.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">usage, with the NPU behind it</text><rect x="24" y="244" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="84" y="244" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="144" y="244" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="204" y="244" width="50" height="50" rx="7" fill="#1a6281"/><text x="278" y="267.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">dGPU</text><text x="278" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">usage; teal from the right = asleep</text><rect x="24" y="304" width="50" height="50" rx="7" fill="#02ff00"/><rect x="84" y="304" width="50" height="50" rx="7" fill="#abff00"/><rect x="144" y="304" width="50" height="50" rx="7" fill="#554629"/><rect x="204" y="304" width="50" height="50" rx="7" fill="#2a2d33"/><text x="278" y="327.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Temperature</text><text x="278" y="344.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">30-90 °C; blinks above 90 °C</text></svg>
