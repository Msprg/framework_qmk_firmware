<svg xmlns="http://www.w3.org/2000/svg" width="720" height="98" viewBox="0 0 720 98" role="img" aria-label="The iGPU row and its NPU ghost bar"><title>The iGPU row and its NPU ghost bar</title><rect width="720" height="98" rx="12" fill="#16181c"/><style>.a{animation:9.000s linear infinite}.s{animation:9.000s step-end infinite}@media (prefers-reduced-motion:reduce){.a,.s{animation:none}}@keyframes a1{0%{fill:#ff0000}35.56%{fill:#ff0000}35.91%{fill:#fb0101}37.33%{fill:#ca0b0d}37.69%{fill:#ba6f72}38.04%{fill:#a89a9e}38.4%{fill:#8ea5a8}38.76%{fill:#67abaf}39.11%{fill:#0fb1b5}66.84%{fill:#0fb1b5}67.2%{fill:#8ea5a8}67.56%{fill:#ba8b8e}67.91%{fill:#d66f71}68.27%{fill:#f04548}68.62%{fill:#ff0000}99.91%{fill:#ff0000}100%{fill:#ff0000}}@keyframes a2{0%{fill:#3b292f}35.56%{fill:#3b292f}35.91%{fill:#2a2d33}37.69%{fill:#2a2d33}38.04%{fill:#225058}38.4%{fill:#198287}38.76%{fill:#139fa3}39.11%{fill:#0fb1b5}66.84%{fill:#0fb1b5}67.2%{fill:#12a5a8}67.91%{fill:#198186}68.27%{fill:#1f636a}68.62%{fill:#612126}68.98%{fill:#a01417}69.69%{fill:#de0708}70.04%{fill:#f50202}70.4%{fill:#fe0000}99.91%{fill:#fe0000}100%{fill:#fe0000}}@keyframes a3{0%{fill-opacity:1}33.33%{fill-opacity:0}}@keyframes a4{0%{fill-opacity:0}33.33%{fill-opacity:1}66.67%{fill-opacity:0}}@keyframes a5{0%{fill-opacity:0}66.67%{fill-opacity:1}}</style><rect x="24" y="24" width="50" height="50" rx="7" fill="#ff0000"/><rect class="a" style="animation-name:a1" x="84" y="24" width="50" height="50" rx="7" fill="#0fb1b5"/><rect class="a" style="animation-name:a2" x="144" y="24" width="50" height="50" rx="7" fill="#0fb1b5"/><rect x="204" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><g class="s" style="animation-name:a3" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">NPU idle</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">just the iGPU's red bar (here 50 %)</text></g><g class="s" style="animation-name:a4" fill-opacity="1"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">NPU busier than the iGPU</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">dim cyan past the red bar (iGPU 25 %, NPU 75 %)</text></g><g class="s" style="animation-name:a5" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">iGPU busier than the NPU</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the cyan is hidden behind the red bar (75 % / 25 %)</text></g></svg>
