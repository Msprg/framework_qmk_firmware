<svg xmlns="http://www.w3.org/2000/svg" width="670" height="234" viewBox="0 0 670 234" role="img" aria-label="The iGPU row and its NPU ghost bar"><title>The iGPU row and its NPU ghost bar</title><rect width="670" height="234" rx="12" fill="#16181c"/><rect x="400" y="24" width="50" height="50" rx="7" fill="#ff0000"/><rect x="460" y="24" width="50" height="50" rx="7" fill="#ff0000"/><rect x="520" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="580" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><text x="20" y="46.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">NPU idle</text><text x="20" y="63.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">just the iGPU's red bar (here 50 %)</text><rect x="400" y="92" width="50" height="50" rx="7" fill="#ff0000"/><rect x="460" y="92" width="50" height="50" rx="7" fill="#178c8f"/><rect x="520" y="92" width="50" height="50" rx="7" fill="#178c8f"/><rect x="580" y="92" width="50" height="50" rx="7" fill="#2a2d33"/><text x="20" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">NPU busier than the iGPU</text><text x="20" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">dim cyan past the red bar (iGPU 25 %, NPU 75 %)</text><rect x="400" y="160" width="50" height="50" rx="7" fill="#ff0000"/><rect x="460" y="160" width="50" height="50" rx="7" fill="#ff0000"/><rect x="520" y="160" width="50" height="50" rx="7" fill="#ff0000"/><rect x="580" y="160" width="50" height="50" rx="7" fill="#2a2d33"/><text x="20" y="182.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">iGPU busier than the NPU</text><text x="20" y="199.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the cyan is hidden behind the red bar</text></svg>
