<svg xmlns="http://www.w3.org/2000/svg" width="560" height="378" viewBox="0 0 560 378" role="img" aria-label="The disconnect warning"><title>The disconnect warning</title><rect width="560" height="378" rx="12" fill="#16181c"/><rect x="24" y="24" width="50" height="30" rx="7" fill="#ffef00"/><rect x="84" y="24" width="50" height="30" rx="7" fill="#ffef00"/><rect x="144" y="24" width="50" height="30" rx="7" fill="#2a2d33"/><rect x="204" y="24" width="50" height="30" rx="7" fill="#2a2d33"/><rect x="24" y="64" width="50" height="50" rx="7" fill="#ffef00"/><rect x="84" y="64" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="144" y="64" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="204" y="64" width="50" height="50" rx="7" fill="#ffef00"/><rect x="24" y="124" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="84" y="124" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="144" y="124" width="50" height="50" rx="7" fill="#ffef00"/><rect x="204" y="124" width="50" height="50" rx="7" fill="#ffef00"/><rect x="24" y="184" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="84" y="184" width="50" height="50" rx="7" fill="#ffef00"/><rect x="144" y="184" width="50" height="50" rx="7" fill="#ffef00"/><rect x="204" y="184" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="24" y="244" width="50" height="50" rx="7" fill="#ffef00"/><rect x="84" y="244" width="50" height="50" rx="7" fill="#ffef00"/><rect x="144" y="244" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="204" y="244" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="24" y="304" width="50" height="50" rx="7" fill="#ffef00"/><rect x="84" y="304" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="144" y="304" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="204" y="304" width="50" height="50" rx="7" fill="#ffef00"/><text x="278" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Disconnect warning</text><text x="278" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">Black and yellow caution stripes,</text><text x="278" y="109" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">shown for 10 s when the host program</text><text x="278" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">stopped sending without saying</text><text x="278" y="147" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">goodbye (a crash, a hang). Then the</text><text x="278" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">pad falls back to its regular</text><text x="278" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">RGB effect.</text></svg>
