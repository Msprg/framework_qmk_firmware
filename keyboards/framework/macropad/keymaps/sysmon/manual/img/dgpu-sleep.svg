<svg xmlns="http://www.w3.org/2000/svg" width="600" height="392" viewBox="0 0 600 392" role="img" aria-label="The dGPU sleep marker"><title>The dGPU sleep marker</title><rect width="600" height="392" rx="12" fill="#16181c"/><rect x="330" y="24" width="50" height="50" rx="7" fill="#02ff00"/><rect x="390" y="24" width="50" height="50" rx="7" fill="#12ab14"/><rect x="450" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="510" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><text x="20" y="46.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">dGPU awake, 40 % busy</text><text x="20" y="63.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the green usage bar</text><rect x="330" y="92" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="390" y="92" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="450" y="92" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="510" y="92" width="50" height="50" rx="7" fill="#1a6281"/><text x="20" y="114.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Powered off (D3cold)</text><text x="20" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the last key glows dim teal</text><rect x="330" y="160" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="390" y="160" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="450" y="160" width="50" height="50" rx="7" fill="#1a6281"/><rect x="510" y="160" width="50" height="50" rx="7" fill="#1a6281"/><text x="20" y="182.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Off for 15 minutes</text><text x="20" y="199.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">a second key</text><rect x="330" y="228" width="50" height="50" rx="7" fill="#2a2d33"/><rect x="390" y="228" width="50" height="50" rx="7" fill="#1a6281"/><rect x="450" y="228" width="50" height="50" rx="7" fill="#1a6281"/><rect x="510" y="228" width="50" height="50" rx="7" fill="#1a6281"/><text x="20" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Off for 30 minutes</text><text x="20" y="267.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">a third key</text><rect x="330" y="296" width="50" height="50" rx="7" fill="#1a6281"/><rect x="390" y="296" width="50" height="50" rx="7" fill="#1a6281"/><rect x="450" y="296" width="50" height="50" rx="7" fill="#1a6281"/><rect x="510" y="296" width="50" height="50" rx="7" fill="#1a6281"/><text x="20" y="318.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Off for 45 minutes or more</text><text x="20" y="335.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">all four keys</text><text x="20" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">Any wake, even a second long, fades it out; it starts again from one key.</text></svg>
