<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img" aria-label="The dGPU sleep marker"><title>The dGPU sleep marker</title><rect width="720" height="120" rx="12" fill="#16181c"/><style>.a{animation:15.000s linear infinite}.s{animation:15.000s step-end infinite}@media (prefers-reduced-motion:reduce){.a,.s{animation:none}}@keyframes a1{0%{fill:#00ff00}14.08%{fill:#00ff00}14.29%{fill:#02f702}14.93%{fill:#0eb811}15.15%{fill:#149919}15.36%{fill:#1d6e23}15.57%{fill:#2a2d33}61.44%{fill:#2a2d33}61.65%{fill:#224b5b}62.08%{fill:#1c6679}62.29%{fill:#197184}62.93%{fill:#15859b}63.57%{fill:#1192ab}74.67%{fill:#1192ab}74.88%{fill:#14889f}75.09%{fill:#1a6c7f}75.31%{fill:#24492c}75.52%{fill:#24492c}75.73%{fill:#225629}75.95%{fill:#225629}76.37%{fill:#1e6725}76.59%{fill:#1e6725}76.8%{fill:#1d6e23}80.43%{fill:#1d6e23}81.07%{fill:#205f27}81.28%{fill:#205f27}81.71%{fill:#24492c}81.92%{fill:#24492c}82.13%{fill:#2a2d33}99.84%{fill:#2a2d33}100%{fill:#2a2d33}}@keyframes a2{0%{fill:#09d30b}13.44%{fill:#09d30b}13.65%{fill:#0dbd10}13.87%{fill:#13a017}14.08%{fill:#1c7522}14.29%{fill:#2a2d33}48%{fill:#2a2d33}48.43%{fill:#205464}48.64%{fill:#1d6373}49.28%{fill:#177a90}50.13%{fill:#1192ab}75.09%{fill:#1192ab}75.31%{fill:#128fa7}75.52%{fill:#18778b}75.73%{fill:#224b58}75.95%{fill:#2a2d33}99.84%{fill:#2a2d33}100%{fill:#2a2d33}}@keyframes a3{0%{fill:#2a2d33}34.77%{fill:#2a2d33}34.99%{fill:#224b58}35.41%{fill:#1c6679}36.05%{fill:#167e93}36.91%{fill:#1192ab}75.73%{fill:#1192ab}75.95%{fill:#168096}76.16%{fill:#1d6172}76.37%{fill:#2a2d33}99.84%{fill:#2a2d33}100%{fill:#2a2d33}}@keyframes a4{0%{fill:#2a2d33}13.44%{fill:#2a2d33}13.65%{fill:#544029}13.87%{fill:#674f25}14.72%{fill:#90641b}15.36%{fill:#a47116}23.89%{fill:#a67215}24.11%{fill:#1192aa}76.16%{fill:#1192ab}76.37%{fill:#14889f}76.59%{fill:#1a6e80}76.8%{fill:#2a2d33}80%{fill:#2a2d33}80.43%{fill:#5f4826}80.64%{fill:#6d5123}81.07%{fill:#835e1e}82.13%{fill:#a67215}85.33%{fill:#a67215}85.55%{fill:#1192aa}99.84%{fill:#1192aa}100%{fill:#1192aa}}@keyframes a5{0%{fill-opacity:1}13.33%{fill-opacity:0}}@keyframes a6{0%{fill-opacity:0}13.33%{fill-opacity:1}23.33%{fill-opacity:0}}@keyframes a7{0%{fill-opacity:0}23.33%{fill-opacity:1}33.33%{fill-opacity:0}}@keyframes a8{0%{fill-opacity:0}33.33%{fill-opacity:1}46.67%{fill-opacity:0}}@keyframes a9{0%{fill-opacity:0}46.67%{fill-opacity:1}60%{fill-opacity:0}}@keyframes a10{0%{fill-opacity:0}60%{fill-opacity:1}73.33%{fill-opacity:0}}@keyframes a11{0%{fill-opacity:0}73.33%{fill-opacity:1}80%{fill-opacity:0}}@keyframes a12{0%{fill-opacity:0}80%{fill-opacity:1}}</style><rect class="a" style="animation-name:a1" x="24" y="24" width="50" height="50" rx="7" fill="#2a2d33"/><rect class="a" style="animation-name:a2" x="84" y="24" width="50" height="50" rx="7" fill="#1192ab"/><rect class="a" style="animation-name:a3" x="144" y="24" width="50" height="50" rx="7" fill="#1192ab"/><rect class="a" style="animation-name:a4" x="204" y="24" width="50" height="50" rx="7" fill="#1192ab"/><g class="s" style="animation-name:a5" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Awake, 40 % busy</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the green usage bar</text></g><g class="s" style="animation-name:a6" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Asleep, link still up (D3hot)</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">for a few seconds the last key glows dim orange</text></g><g class="s" style="animation-name:a7" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Powered off (D3cold)</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the key turns dim teal</text></g><g class="s" style="animation-name:a8" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Off for 15 minutes</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">a second key</text></g><g class="s" style="animation-name:a9" fill-opacity="1"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Off for 30 minutes</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">a third key</text></g><g class="s" style="animation-name:a10" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Off for 45 minutes or more</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">all four keys</text></g><g class="s" style="animation-name:a11" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Something wakes it</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">even for a second: the marker fades</text></g><g class="s" style="animation-name:a12" fill-opacity="0"><text x="300" y="47.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Off again</text><text x="300" y="64.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">orange for a moment, then teal from one key</text></g><text x="24" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">Time-lapse: each step is 15 minutes in real life.</text></svg>
