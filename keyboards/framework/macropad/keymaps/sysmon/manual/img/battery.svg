="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">On battery, at 60 %</text><text x="20" y="102.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">red; the edge key flares and fades</text><rect x="400" y="120" width="50" height="30" rx="7" fill="#ffd200"/><rect class="a" style="animation-name:a4" x="460" y="120" width="50" height="30" rx="7" fill="#a88f15"/><rect class="a" style="animation-name:a5" x="520" y="120" width="50" height="30" rx="7" fill="#a88f15"/><rect x="580" y="120" width="50" height="30" rx="7" fill="#2a2d33"/><text x="20" y="133.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">On AC, battery helping the charger</text><text x="20" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">amber: the charger can't keep up</text><rect x="400" y="168" width="50" height="30" rx="7" fill="#11a815"/><rect x="460" y="168" width="50" height="30" rx="7" fill="#11a815"/><rect x="520" y="168" width="50" height="30" rx="7" fill="#11a815"/><rect x="580" y="168" width="50" height="30" rx="7" fill="#11a815"/><text x="20" y="181.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">On AC, battery idle</text><text x="20" y="198.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the whole row steady dim green</text><rect x="400" y="216" width="50" height="30" rx="7" fill="#11a815"/><rect x="460" y="216" width="50" height="30" rx="7" fill="#11a815"/><rect x="520" y="216" width="50" height="30" rx="7" fill="#11a815"/><rect class="a" style="animation-name:a6" x="580" y="216" width="50" height="30" rx="7" fill="#18851e"/><text x="20" y="229.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">On AC, battery drifting</text><text x="20" y="246.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the last key breathes; exaggerated here, faint on the pad</text><rect class="a" style="animation-name:a7" x="400" y="264" width="50" height="30" rx="7" fill="#2a2d33"/><rect class="a" style="animation-name:a8" x="460" y="264" width="50" height="30" rx="7" fill="#2a2d33"/><rect class="a" style="animation-name:a9" x="520" y="264" width="50" height="30" rx="7" fill="#2a2d33"/><rect class="a" style="animation-name:a10" x="580" y="264" width="50" height="30" rx="7" fill="#2a2d33"/><text x="20" y="277.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Draining, below 15 %</text><text x="20" y="294.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the whole row red, blinking</text><text x="20" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">More keys pulse the more power flows: 1 key below 20 W, all 4 from 75 W.</text></svg>
