<svg xmlns="http://www.w3.org/2000/svg" width="690" height="292" viewBox="0 0 690 292" role="img" aria-label="The battery row"><title>The battery row</title><rect width="690" height="292" rx="12" fill="#16181c"/><rect x="420" y="24" width="50" height="30" rx="7" fill="#fffb00"/><rect x="480" y="24" width="50" height="30" rx="7" fill="#fffb00"/><rect x="540" y="24" width="50" height="30" rx="7" fill="#bfbd0f"/><rect x="537" y="21" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="600" y="24" width="50" height="30" rx="7" fill="#bfbd0f"/><rect x="597" y="21" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><text x="20" y="36.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Charging, at 50 %</text><text x="20" y="53.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">red → green as it charges; keys past the edge pulse</text><rect x="420" y="72" width="50" height="30" rx="7" fill="#ff0000"/><rect x="480" y="72" width="50" height="30" rx="7" fill="#ff0000"/><rect x="540" y="72" width="50" height="30" rx="7" fill="#ca0b0d"/><rect x="537" y="69" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="600" y="72" width="50" height="30" rx="7" fill="#2a2d33"/><text x="20" y="84.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">On battery, at 60 %</text><text x="20" y="101.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">red; the edge key flares and fades</text><rect x="420" y="120" width="50" height="30" rx="7" fill="#ffa700"/><rect x="480" y="120" width="50" height="30" rx="7" fill="#ffa700"/><rect x="540" y="120" width="50" height="30" rx="7" fill="#ca890d"/><rect x="537" y="117" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="600" y="120" width="50" height="30" rx="7" fill="#2a2d33"/><text x="20" y="132.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">On AC, battery helping the charger</text><text x="20" y="149.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">amber: the charger can't keep up</text><rect x="420" y="168" width="50" height="30" rx="7" fill="#1b7d20"/><rect x="480" y="168" width="50" height="30" rx="7" fill="#1b7d20"/><rect x="540" y="168" width="50" height="30" rx="7" fill="#1b7d20"/><rect x="600" y="168" width="50" height="30" rx="7" fill="#1b7d20"/><text x="20" y="180.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">On AC, battery idle</text><text x="20" y="197.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the whole row steady dim green</text><rect x="420" y="216" width="50" height="30" rx="7" fill="#ff0000"/><rect x="417" y="213" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="480" y="216" width="50" height="30" rx="7" fill="#ff0000"/><rect x="477" y="213" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="540" y="216" width="50" height="30" rx="7" fill="#ff0000"/><rect x="537" y="213" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="600" y="216" width="50" height="30" rx="7" fill="#ff0000"/><rect x="597" y="213" width="56" height="36" rx="9" fill="none" stroke="#e6e6e6" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3"/><text x="20" y="228.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Draining, below 15 %</text><text x="20" y="245.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">the whole row red, blinking</text><text x="20" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="normal">Dashed outline = the key animates. More keys pulse the more power flows: 1 key below 20 W, all 4 from 75 W.</text></svg>
