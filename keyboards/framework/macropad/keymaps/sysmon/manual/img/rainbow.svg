<svg xmlns="http://www.w3.org/2000/svg" width="560" height="378" viewBox="0 0 560 378" role="img" aria-label="The boot rainbow"><title>The boot rainbow</title><rect width="560" height="378" rx="12" fill="#16181c"/><rect x="24" y="24" width="50" height="30" rx="7" fill="#d4090a"/><rect x="84" y="24" width="50" height="30" rx="7" fill="#d4ac0a"/><rect x="144" y="24" width="50" height="30" rx="7" fill="#5ad50a"/><rect x="204" y="24" width="50" height="30" rx="7" fill="#08d55c"/><rect x="24" y="64" width="50" height="50" rx="7" fill="#d46b0a"/><rect x="84" y="64" width="50" height="50" rx="7" fill="#9bd50a"/><rect x="144" y="64" width="50" height="50" rx="7" fill="#08d51b"/><rect x="204" y="64" width="50" height="50" rx="7" fill="#08d5be"/><rect x="24" y="124" width="50" height="50" rx="7" fill="#d4cd0a"/><rect x="84" y="124" width="50" height="50" rx="7" fill="#39d50a"/><rect x="144" y="124" width="50" height="50" rx="7" fill="#08d57d"/><rect x="204" y="124" width="50" height="50" rx="7" fill="#088bd6"/><rect x="24" y="184" width="50" height="50" rx="7" fill="#7ad50a"/><rect x="84" y="184" width="50" height="50" rx="7" fill="#08d53c"/><rect x="144" y="184" width="50" height="50" rx="7" fill="#08ccd6"/><rect x="204" y="184" width="50" height="50" rx="7" fill="#0829d6"/><rect x="24" y="244" width="50" height="50" rx="7" fill="#18d50a"/><rect x="84" y="244" width="50" height="50" rx="7" fill="#08d59e"/><rect x="144" y="244" width="50" height="50" rx="7" fill="#086ad6"/><rect x="204" y="244" width="50" height="50" rx="7" fill="#4b09d6"/><rect x="24" y="304" width="50" height="50" rx="7" fill="#08d55c"/><rect x="84" y="304" width="50" height="50" rx="7" fill="#08acd6"/><rect x="144" y="304" width="50" height="50" rx="7" fill="#0909d6"/><rect x="204" y="304" width="50" height="50" rx="7" fill="#ad09d6"/><text x="278" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="start" font-weight="600">Boot rainbow</text><text x="278" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">Dim and still, red at the top-left</text><text x="278" y="109" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">to violet at the bottom-right,</text><text x="278" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">from power-up until the host</text><text x="278" y="147" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">program first connects. A short</text><text x="278" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">animation introduces it, a</text><text x="278" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="normal">different one each power-up.</text></svg>
